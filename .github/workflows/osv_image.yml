name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@43dc41bad01cae0e4aaad4329aa4c6938592c137 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
