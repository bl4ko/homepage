name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@dc74c0fc8380cd32b937c3b868a27e75f5869e94 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
