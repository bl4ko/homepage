    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@20af0847e51903a741256eee51cff4157d8ef6f0 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
