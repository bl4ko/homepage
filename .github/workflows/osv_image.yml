name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@592d97ee035028d3291f4168c85b95103c077933 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
