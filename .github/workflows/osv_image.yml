name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@0ca5df8b57052d5dbc9e2e0a564658374d0193f6 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
