name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@d886ed1e2c3da7d525407bbfe3b597373fc164be # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
