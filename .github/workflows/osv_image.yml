    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@2e0fe6fd804d614c80635dbd38c857f98d0f9b88 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
