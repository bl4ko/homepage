name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@c610d10ea87afbec75bbe13637f0680f519ce164 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
