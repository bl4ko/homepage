    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@d8c74fe0b14439570ffb8017a3c5cbfcbd30fd90 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
