name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@b07991ad75dc84f3c63eabdd59d376f669271d86 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
