name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@b50724923d2057a8502c22cccf13b22a0abfe64a # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
