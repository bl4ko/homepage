    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@36e2edbe6d5048a2933852c385e235ccb4ba5cce # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
