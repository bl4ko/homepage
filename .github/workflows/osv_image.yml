name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@baf01ff7a2e378a733283b1a26dd56d8108cf4e2 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
