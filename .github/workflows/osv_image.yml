name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@d3320bd87fc326536c7fa9ac461a627193298764 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
