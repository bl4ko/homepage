name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@856b98a2b4061ccfacaa4c60d838d25320ab01d0 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
