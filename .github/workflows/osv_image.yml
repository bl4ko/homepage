name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@88d4627ceaadedd0eedaa3de9201e25afae6ddb4 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
