name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@09057d6663745ef32913c88be176c73df594d7d4 # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
