name: OSV-Scanner scan Containerfile
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
jobs:
  osv_scan_image:
    uses: bl4ko/shared-actions/.github/workflows/osv_image.yml@e262ccc1dc46cf7a264abdae23a509686b8e97fb # main
    permissions:
      contents: read
      packages: write
    with:
      containerfile: ./Dockerfile
